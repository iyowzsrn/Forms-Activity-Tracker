<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocked during the exam</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1f2328; --muted: #5b6470;
    --accent: #d93025; --btn: #1e6b52; --btn-text: #ffffff; --border: #e2e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --card: #1f2228; --text: #eceff3; --muted: #a3acb9;
      --accent: #ff6b5e; --btn: #3aa57f; --btn-text: #0b1a14; --border: #2e333b;
    }
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    max-width: 480px; width: 100%; padding: 32px 28px; text-align: center; box-sizing: border-box;
  }
  .icon { font-size: 44px; margin-bottom: 8px; }
  h1 { font-size: 22px; margin: 0 0 12px; color: var(--accent); }
  p { margin: 8px 0; line-height: 1.5; color: var(--muted); }
  .site { color: var(--text); font-weight: 600; word-break: break-all; }
  .buttons { margin-top: 22px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button, a.btn {
    font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--card); color: var(--text); text-decoration: none;
  }
  button.primary, a.btn.primary { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">&#128274;</div>

    <div id="activeBox">
      <h1>Blocked during the exam</h1>
      <p><span class="site" id="site">This page</span> is not allowed while your exam form is open.</p>
      <p>This attempt has been recorded. Please return to your exam.</p>
      <div class="buttons">
        <button class="primary" id="closeBtn">Close this tab</button>
        <button id="backBtn">Go back</button>
      </div>
    </div>

    <div id="endedBox" class="hidden">
      <h1 style="color: var(--btn);">The exam has ended</h1>
      <p>Monitoring has stopped, so you can open this page again.</p>
      <div class="buttons">
        <a class="btn primary hidden" id="openLink" href="#">Open the page</a>
        <button id="closeBtn2">Close this tab</button>
      </div>
    </div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
